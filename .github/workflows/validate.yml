name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  python:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 1
      - name: Verify checkout integrity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -f tests/test_execution_hardening.py
          grep -q 'Authorization: Bearer abcdefghijklmnop' tests/test_execution_hardening.py
          grep -q 'test_redact_text_preserves_placeholder_authorization' tests/test_execution_hardening.py
          if grep -q 'assert "\\*\\*\\*" in redacted' tests/test_execution_hardening.py; then echo 'Stale redaction assertion found in checkout' >&2; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Python shared library path
        shell: bash
        run: |
          PYTHON_BIN="$(readlink -f "$(command -v python)")"
          PYTHON_PREFIX="$(dirname "$(dirname "$PYTHON_BIN")")"

          echo "Python prefix: $PYTHON_PREFIX"
          echo "LD_LIBRARY_PATH=$PYTHON_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          export LD_LIBRARY_PATH="$PYTHON_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          python --version
          python -c "import sys; print(sys.executable)"
      - name: Install Python development shared libraries
        # Needed so that subprocess launched Python can find libpython3.X.so.1.0
        # (avoids "error while loading shared libraries: libpython3.X.so.1.0"
        # on self-hosted runners with Python 3.10+).
        run: |
          python -c "import sys; print(sys.executable)"
          for pyver in "3.10" "3.13"; do
            if [[ "${{ matrix.python-version }}" == "$pyver" ]]; then
              apt-get update -qq && apt-get install -y libpython$pyver-dev 2>/dev/null || true
            fi
          done
      - name: Install Jarvis and development dependencies
        run: python -m pip install --no-cache-dir -e . -r requirements.txt twine
      - name: Verify coordinated Core
        run: |
          python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.18.0'"
          python -c "from jarvis_core import Capability, CapabilityPolicy, InferenceClient, InferenceClientError, InferenceConfig, SandboxRequirements; assert all((Capability, CapabilityPolicy, InferenceClient, InferenceClientError, InferenceConfig, SandboxRequirements))"
          python -c "from jarvis_core.execution_maturity import Checkpoint, ProcessHandle, SteeringCommand; assert all((Checkpoint, ProcessHandle, SteeringCommand))"
          python -c "from jarvis_core import RouteCalibrator, RouteObservation; assert all((RouteCalibrator, RouteObservation))"
      - name: Verify imported checkout sources
        run: |
          python -c "import jarvis_cli.execution_hardening as m; print(m.__file__)"
          python -c "from pathlib import Path; p=Path('tests/test_execution_hardening.py').read_text(); assert 'Authorization: Bearer abcdefghijklmnop' in p"
      - run: black --check --diff src tests
      - run: ruff check src tests --select E9,F63,F7,F82
      - name: Configure Python toolcache shared libraries
        shell: bash
        run: |
          set -euo pipefail

          TOOLCACHE="$HOME/actions-runner/_work/_tool/Python"
          LIB_PATHS=()

          for version_dir in "$TOOLCACHE"/3.10.* "$TOOLCACHE"/3.12.* "$TOOLCACHE"/3.13.*; do
            [ -d "$version_dir/x64/lib" ] || continue

            libdir="$version_dir/x64/lib"
            LIB_PATHS+=("$libdir")
            echo "Found Python libraries: $libdir"
          done

          if [ "${#LIB_PATHS[@]}" -eq 0 ]; then
            echo "::error::No Python shared library directories found"
            find "$TOOLCACHE" -maxdepth 4 -type d -name lib
            exit 1
          fi
      - name: Verify Python runtimes
        shell: bash
        run: |
          set -euo pipefail

          TOOLCACHE="$HOME/actions-runner/_work/_tool/Python"

          for version_dir in "$TOOLCACHE"/3.10.* "$TOOLCACHE"/3.12.* "$TOOLCACHE"/3.13.*; do
            [ -x "$version_dir/x64/bin/python" ] || continue

            PY="$version_dir/x64/bin/python"
            echo "Checking $PY"

            "$PY" --version
            "$PY" -c "import sys; print(sys.executable)"
            ldd "$PY" | grep "not found" && exit 1 || true
          done
      - name: Verify Python matrix runtimes
        shell: bash
        run: |
          TOOLCACHE="$HOME/actions-runner/_work/_tool/Python"

          for version in 3.10.* 3.12.* 3.13.*; do
            for py in "$TOOLCACHE"/"$version"/x64/bin/python; do
              [ -x "$py" ] || continue

              echo "Testing: $py"
              "$py" --version
              ldd "$py" | grep "not found" && exit 1 || true
            done
          done
      - name: Run tests from a clean source/bytecode state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pytest_cache /tmp/jarvis-cli-pytest-cache
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          python -m pytest --collect-only -q tests/test_execution_hardening.py
          set -o pipefail
          python -m pytest -q --cache-clear --cov=. --cov-report=term-missing --cov-fail-under=70 2>&1 | tee /tmp/jarvis-pytest.log
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: /tmp/jarvis-pytest.log
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/jarvis-clean-install
          /tmp/jarvis-clean-install/bin/python -m pip install --no-cache-dir dist/*.whl
          /tmp/jarvis-clean-install/bin/jarvis --version
          /tmp/jarvis-clean-install/bin/python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.18.0'"
          /tmp/jarvis-clean-install/bin/python -c "from jarvis_cli.sdk import CloudWorker; assert CloudWorker.__name__ == 'FencedCloudWorker'"
      - name: Write commit-bound certification manifest
        if: always()
        run: python scripts/write_certification_manifest.py certification-evidence.json
      - name: Upload certification evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence-${{ github.sha }}-python-${{ matrix.python-version }}
          path: certification-evidence.json
          if-no-files-found: error
